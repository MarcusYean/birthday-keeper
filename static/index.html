<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎂 生日管家</title>
<link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body class="menu-left">
<!-- 登录 / 初始化 -->
<div id="auth-view" class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo">🎂</div>
      <h1>生日管家</h1>
      <p class="brand-sub" id="auth-sub">记录亲友生日 · 农历/公历 · 微信 & 飞书提醒</p>
    </div>
    <form id="login-form" class="auth-form">
      <label>用户名</label>
      <input id="login-user" type="text" autocomplete="username" placeholder="请输入用户名" required />
      <label>密码</label>
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="请输入密码" required />
      <button type="submit" class="btn btn-primary btn-block">登录</button>
    </form>
    <form id="setup-form" class="auth-form hidden">
      <div class="callout">首次使用，请创建管理员账号（用于配置提醒参数）。</div>
      <label>管理员用户名</label>
      <input id="setup-user" type="text" placeholder="如 admin" required />
      <label>管理员密码</label>
      <input id="setup-pass" type="password" placeholder="设置登录密码" required />
      <button type="submit" class="btn btn-primary btn-block">创建并进入</button>
    </form>
  </div>
</div>

<!-- 主应用 -->
<div id="app-view" class="app hidden">
  <aside class="sidebar">
    <div class="side-brand">🎂 生日管家</div>
    <nav class="nav">
      <a class="nav-item" data-view="contacts"><span>👥</span> 联系人</a>
      <a class="nav-item" id="nav-anniversaries" data-view="anniversaries"><span>📌</span> 纪念日</a>
      <a class="nav-item" data-view="upcoming"><span>⏰</span> 即将到来</a>
      <a class="nav-item admin-only" data-view="settings"><span>⚙️</span> 设置</a>
      <a class="nav-item admin-only" data-view="users"><span>🧑‍💼</span> 用户管理</a>
    </nav>
    <div class="side-foot">v2.2 · 自托管</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title" id="view-title">联系人</div>
      <div class="topbar-right">
        <span class="user-chip" id="user-chip"></span>
        <button class="btn btn-ghost btn-sm" id="logout-btn">退出</button>
      </div>
    </header>

    <main class="content">
      <!-- 联系人 -->
      <section id="view-contacts" class="view">
        <div class="toolbar" id="contacts-toolbar">
          <div class="toolbar-left">
            <button class="btn btn-primary" id="add-btn">+ 添加联系人</button>
            <button class="btn btn-ghost" id="refresh-btn">刷新</button>
            <div class="select-group">
              <button class="btn btn-ghost btn-sm" id="select-all-btn">全选</button>
              <button class="btn btn-ghost btn-sm" id="select-inv-btn">反选</button>
              <button class="btn btn-ghost btn-sm" id="select-none-btn">取消</button>
            </div>
            <button class="btn btn-ghost" id="batch-test-btn">🔔 批量测试 <span id="batch-count" class="badge"></span></button>
          </div>
          <div class="toolbar-right">
            <div class="tool-group">
              <label for="per-page">每页</label>
              <select id="per-page"><option value="10">10</option><option value="20">20</option><option value="50" selected>50</option><option value="100">100</option><option value="200">200</option><option value="0">全部</option></select>
            </div>
            <div class="tool-group">
              <label for="view-mode">视图</label>
              <select id="view-mode"><option value="list">列表</option><option value="card">卡片</option><option value="compact">紧凑</option></select>
            </div>
            <div class="tool-group">
              <label for="sort-by">排序</label>
              <select id="sort-by">
                <option value="days_until_asc">按倒计时 ↑</option>
                <option value="days_until_desc">按倒计时 ↓</option>
                <option value="name_asc">名称 A-Z</option>
                <option value="name_desc">名称 Z-A</option>
                <option value="age_asc">年龄从小到大</option>
                <option value="age_desc">年龄从大到小</option>
                <option value="month_day_asc">按生日月份</option>
                <option value="created_at_desc">最近添加</option>
              </select>
            </div>
            <div class="tool-group">
              <label for="group-by">分类</label>
              <select id="group-by">
                <option value="none">不分组</option>
                <option value="relationship">按关系</option>
                <option value="gender">按性别</option>
                <option value="zodiac">按星座</option>
                <option value="chinese_zodiac">按生肖</option>
                <option value="calendar_type">按历法</option>
                <option value="birth_month">按生日月份</option>
              </select>
            </div>
            <button class="btn btn-ghost" id="fields-btn">显示字段</button>
          </div>
        </div>
        <div id="contacts-list" class="card"></div>
        <div class="pagination" id="contacts-paging"></div>
      </section>

      <!-- 纪念日 -->
      <section id="view-anniversaries" class="view hidden">
        <div class="toolbar">
          <button class="btn btn-primary" id="add-anni-btn">+ 添加纪念日</button>
          <button class="btn btn-ghost" id="refresh-anni-btn">刷新</button>
          <button class="btn btn-ghost" id="batch-test-anni-btn">🔔 批量测试</button>
        </div>
        <div id="anniversaries-list" class="card"></div>
      </section>

      <!-- 即将到来 -->
      <section id="view-upcoming" class="view hidden">
        <div class="card" id="upcoming-list"></div>
      </section>

      <!-- 设置 -->
      <section id="view-settings" class="view hidden">
        <div class="settings-layout">
          <nav class="settings-nav" id="settings-nav"></nav>
          <div class="settings-main">
            <div class="toolbar">
              <button class="btn btn-primary" id="save-settings-btn">保存设置</button>
              <span class="muted" id="settings-hint">修改后立即生效，无需重启。</span>
            </div>
            <div id="settings-form"></div>
          </div>
        </div>
      </section>

      <!-- 用户管理 -->
      <section id="view-users" class="view hidden">
        <div class="toolbar">
          <button class="btn btn-primary" id="add-user-btn">+ 新增用户</button>
        </div>
        <div class="card" id="users-list"></div>
      </section>
    </main>
  </div>
</div>

<!-- 右侧抽屉（联系人/纪念日编辑） -->
<div class="drawer-overlay" id="drawer-overlay">
  <div class="drawer" id="drawer"></div>
</div>

<!-- 通用弹窗 -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<div id="toast"></div>
<div id="tooltip" class="tooltip" role="tooltip"></div>

<script src="/static/js/app.js"></script>
</body>
</html>
