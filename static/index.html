<!DOCTYPE html>
<html lang="zh-CN" data-mode="light" data-accent="teal">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title data-i18n="app.title">生日管家</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/css/styles.css?v=2.7.0" />
</head>
<body>

<!-- icon set: 16px outline, drawn for this product -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="ic-cake" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 21h16" /><path d="M6.5 21v-9h11v9" />
      <path d="M12 12V8.5" /><path d="M12 8.8c1.4-1 1.4-2.5 0-3.4-1.4.9-1.4 2.4 0 3.4z" />
    </g>
    <g id="ic-cal" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="4.5" width="18" height="17" rx="2" /><path d="M16 2.5v4M8 2.5v4M3 10h18" />
    </g>
    <g id="ic-people" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="8" r="3.6" /><path d="M2.5 21c0-3.4 2.9-5.2 6.5-5.2S15.5 17.6 15.5 21" />
      <path d="M16 5.4a3.6 3.6 0 010 5.4M18.2 21c0-2.6-1.3-4.4-3.4-5.1" />
    </g>
    <g id="ic-person" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="4" /><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6" />
    </g>
    <g id="ic-flag" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 22V3" /><path d="M5 4h13l-2.5 4.5L18 13H5" />
    </g>
    <g id="ic-clock" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9" /><path d="M12 6.8V12l3.4 2" />
    </g>
    <g id="ic-home" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11.2L12 3l9 8.2" /><path d="M5.5 10v11h13V10" />
    </g>
    <g id="ic-badge" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9" /><circle cx="12" cy="10" r="3" />
      <path d="M6 19.2c1.6-3 3.5-4.4 6-4.4s4.4 1.4 6 4.4" />
    </g>
    <g id="ic-gear" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3.2" />
      <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1" />
    </g>
    <g id="ic-bell" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 8.5a6 6 0 10-12 0c0 6.5-3 8.5-3 8.5h18s-3-2-3-8.5" />
      <path d="M13.7 20.5a2 2 0 01-3.4 0" />
    </g>
    <g id="ic-menu" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M3 6h18M3 12h18M3 18h18" />
    </g>
    <g id="ic-plus" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
      <path d="M12 5v14M5 12h14" />
    </g>
    <g id="ic-filter" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 4.5h18l-7 8.2v5.6l-4 2.2v-7.8z" />
    </g>
    <g id="ic-info" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9" /><path d="M12 11.2v5" /><path d="M12 7.9h.01" />
    </g>
    <g id="ic-grid" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3.5" y="3.5" width="7" height="7" rx="1.8" /><rect x="13.5" y="3.5" width="7" height="7" rx="1.8" />
      <rect x="3.5" y="13.5" width="7" height="7" rx="1.8" /><rect x="13.5" y="13.5" width="7" height="7" rx="1.8" />
    </g>
    <g id="ic-list" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 6h13M8 12h13M8 18h13" /><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01" />
    </g>
    <g id="ic-dot" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" />
    </g>
    <g id="ic-logout" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 4h4.5a1.5 1.5 0 011.5 1.5v13a1.5 1.5 0 01-1.5 1.5H14" /><path d="M10 8l-4 4 4 4" /><path d="M6 12h9" />
    </g>
    <g id="ic-sun" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4" />
      <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" />
    </g>
    <g id="ic-moon" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z" />
    </g>
  </defs>
</svg>

<!-- 登录 / 初始化 -->
<div id="auth-view" class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <h1 data-i18n="app.name">生日管家</h1>
      <p class="brand-sub" id="auth-sub" data-i18n="auth.sub.login">记录亲友生日 · 农历/公历 · 微信 &amp; 飞书提醒</p>
    </div>

    <form id="login-form" class="auth-form">
      <label data-i18n="label.username">用户名</label>
      <input id="login-user" type="text" autocomplete="username" data-i18n-ph="placeholder.username" required />
      <label data-i18n="label.password">密码</label>
      <input id="login-pass" type="password" autocomplete="current-password" data-i18n-ph="placeholder.password" required />
      <button type="submit" class="btn btn-primary btn-block" data-i18n="btn.login">登录</button>
      <div class="auth-links">
        <a href="#" id="to-register" data-i18n="link.register">注册账号</a>
        <a href="#" id="to-forgot" data-i18n="link.forgot">忘记密码</a>
      </div>
    </form>

    <form id="setup-form" class="auth-form hidden">
      <div class="callout" data-i18n="setup.callout">首次使用，请创建管理员账号（用于配置提醒参数）。</div>
      <label data-i18n="label.adminUser">管理员用户名</label>
      <input id="setup-user" type="text" data-i18n-ph="placeholder.adminUser" required />
      <label data-i18n="label.adminPass">管理员密码</label>
      <input id="setup-pass" type="password" data-i18n-ph="placeholder.adminPass" required />
      <button type="submit" class="btn btn-primary btn-block" data-i18n="btn.createAdmin">创建并进入</button>
    </form>

    <form id="register-form" class="auth-form hidden">
      <div class="callout" id="register-callout" data-i18n="register.callout">注册新账号（需管理员在设置中开启注册）。</div>
      <label data-i18n="label.username">用户名</label>
      <input id="reg-user" type="text" data-i18n-ph="placeholder.regUser" required />
      <label data-i18n="label.password">密码</label>
      <input id="reg-pass" type="password" data-i18n-ph="placeholder.regPass" required />
      <button type="submit" class="btn btn-primary btn-block" data-i18n="btn.register">注册并登录</button>
      <a href="#" class="auth-back" id="reg-back" data-i18n="link.back">返回登录</a>
    </form>

    <form id="forgot-form" class="auth-form hidden">
      <div class="callout" data-i18n="forgot.callout">输入用户名，若系统已配置邮件，我们将发送重置链接。</div>
      <label data-i18n="label.username">用户名</label>
      <input id="forgot-user" type="text" data-i18n-ph="placeholder.username" required />
      <button type="submit" class="btn btn-primary btn-block" data-i18n="btn.sendReset">发送重置邮件</button>
      <div class="auth-msg" id="forgot-msg"></div>
      <a href="#" class="auth-back" id="forgot-back" data-i18n="link.back">返回登录</a>
    </form>

    <form id="reset-form" class="auth-form hidden">
      <div class="callout" data-i18n="reset.callout">设置你的新密码。</div>
      <label data-i18n="label.newPassword">新密码</label>
      <input id="reset-pass" type="password" data-i18n-ph="placeholder.regPass" required />
      <button type="submit" class="btn btn-primary btn-block" data-i18n="btn.resetPass">重置密码</button>
      <div class="auth-msg" id="reset-msg"></div>
      <a href="#" class="auth-back" id="reset-back" data-i18n="link.back">返回登录</a>
    </form>
  </div>
</div>

<!-- 主应用 -->
<div id="app-view" class="app hidden">
  <aside class="sidebar">
    <div class="side-brand">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><use href="#ic-cake" /></svg>
      <span data-i18n="app.name">生日管家</span>
    </div>
    <nav class="nav" id="nav">
      <a class="nav-item" data-view="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-cal" /></svg> <span class="nav-label" data-i18n="nav.dashboard">首页</span></a>
      <a class="nav-item" data-view="contacts"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-person" /></svg> <span class="nav-label" data-i18n="nav.contacts">联系人</span></a>
      <a class="nav-item" id="nav-anniversaries" data-view="anniversaries"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-flag" /></svg> <span class="nav-label" data-i18n="nav.anniversaries">纪念日</span></a>
      <a class="nav-item" data-view="upcoming"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-clock" /></svg> <span class="nav-label" data-i18n="nav.upcoming">即将到来</span></a>
      <a class="nav-item" data-view="family"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-home" /></svg> <span class="nav-label" data-i18n="nav.family">家庭</span> <span id="invite-badge" class="badge hidden"></span></a>
      <a class="nav-item" data-view="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-badge" /></svg> <span class="nav-label" data-i18n="nav.profile">个人资料及偏好</span></a>
      <a class="nav-item admin-only" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-gear" /></svg> <span class="nav-label" data-i18n="nav.settings">设置</span></a>
      <a class="nav-item admin-only" data-view="users"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-people" /></svg> <span class="nav-label" data-i18n="nav.users">用户管理</span></a>
    </nav>

    <div class="side-foot">
      <div style="position:relative;display:flex;align-items:center;gap:6px">
        <button class="icon-btn" id="notif-bell" aria-label="提醒"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-bell" /></svg><span class="badge hidden" id="notif-unread"></span></button>
        <button class="side-user" id="user-chip"></button>
        <div class="notif-panel hidden" id="notif-panel">
          <div class="notif-head"><b data-i18n="notif.title">我的提醒</b><button class="btn btn-ghost btn-sm" id="notif-read-all" data-i18n="notif.readAll">全部已读</button></div>
          <div id="notif-list" class="notif-list"></div>
        </div>
        <div class="user-menu" id="user-menu">
          <button type="button" class="user-menu-item" data-go="profile" data-i18n="nav.profile">个人资料及偏好</button>
          <button type="button" class="user-menu-item" data-go="settings" data-i18n="nav.settings">设置</button>
          <div class="user-menu-sep"></div>
          <button type="button" class="user-menu-item danger" id="user-logout" data-i18n="topbar.logout">退出</button>
        </div>
      </div>
      <div class="side-foot-note">v2.7.0 · <span data-i18n="side.foot">自托管</span></div>
    </div>
  </aside>

  <div class="main">
    <main class="content">

      <!-- 首页看板 -->
      <section id="view-dashboard" class="view hidden">
        <div class="page-head" id="head-dashboard"><div class="head-main"></div><div class="acts"><button class="btn btn-ghost" id="dash-refresh" data-i18n="dashboard.refresh">刷新看板</button></div></div>
        <div id="dashboard-content" style="display:flex;flex-direction:column;gap:16px"></div>
      </section>

      <!-- 联系人 -->
      <section id="view-contacts" class="view hidden">
        <div class="page-head" id="head-contacts"><div class="head-main"></div></div>
        <div class="toolbar" id="contacts-toolbar">
          <div class="toolbar-left">
            <button class="btn btn-primary" id="add-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-plus" /></svg> <span data-i18n="contact.add">添加联系人</span></button>
            <button class="btn btn-ghost" id="refresh-btn" data-i18n="btn.refresh">刷新</button>
            <div class="select-group">
              <button class="btn btn-ghost btn-sm" id="select-all-btn" data-i18n="toolbar.selectAll">全选</button>
              <button class="btn btn-ghost btn-sm" id="select-inv-btn" data-i18n="toolbar.selectInv">反选</button>
              <button class="btn btn-ghost btn-sm" id="select-none-btn" data-i18n="toolbar.selectNone">取消</button>
            </div>
            <button class="btn btn-ghost" id="batch-test-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-bell" /></svg> <span data-i18n="toolbar.batchTest">批量测试</span> <span id="batch-count" class="badge"></span></button>
          </div>
          <div class="toolbar-right">
            <input id="contact-search" class="search-input" type="search" data-i18n-ph="search.placeholder" placeholder="搜索…" />
            <button class="btn btn-ghost" id="contact-filter-toggle"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-filter" /></svg> <span data-i18n="filter.title">筛选</span> <span id="contact-filter-count" class="badge"></span></button>
            <div class="tool-group">
              <label for="per-page" data-i18n="toolbar.perPage">每页</label>
              <select id="per-page"><option value="10">10</option><option value="20">20</option><option value="50" selected>50</option><option value="100">100</option><option value="200">200</option><option value="0" data-i18n="pagination.all">全部</option></select>
            </div>
            <div class="seg" id="view-mode" role="group">
              <button type="button" data-mode="card" class="on"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><use href="#ic-grid" /></svg> <span data-i18n="view.card">卡片</span></button>
              <button type="button" data-mode="list"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><use href="#ic-list" /></svg> <span data-i18n="view.table">表格</span></button>
            </div>
            <div class="tool-group">
              <label for="sort-by" data-i18n="toolbar.sort">排序</label>
              <select id="sort-by">
                <option value="days_until_asc" data-i18n="sort.days_asc">按倒计时 ↑</option>
                <option value="days_until_desc" data-i18n="sort.days_desc">按倒计时 ↓</option>
                <option value="name_asc" data-i18n="sort.name_asc">名称 A-Z</option>
                <option value="name_desc" data-i18n="sort.name_desc">名称 Z-A</option>
                <option value="age_asc" data-i18n="sort.age_asc">年龄从小到大</option>
                <option value="age_desc" data-i18n="sort.age_desc">年龄从大到小</option>
                <option value="days_lived_asc" data-i18n="sort.lived_asc">已活天数 ↑</option>
                <option value="days_lived_desc" data-i18n="sort.lived_desc">已活天数 ↓</option>
                <option value="month_day_asc" data-i18n="sort.month">按生日月份</option>
                <option value="created_at_desc" data-i18n="sort.recent">最近添加</option>
              </select>
            </div>
            <div class="tool-group">
              <label for="group-by" data-i18n="toolbar.group">分类</label>
              <select id="group-by">
                <option value="none" data-i18n="group.none">不分组</option>
                <option value="relationship" data-i18n="group.relationship">按关系</option>
                <option value="gender" data-i18n="group.gender">按性别</option>
                <option value="zodiac" data-i18n="group.zodiac">按星座</option>
                <option value="chinese_zodiac" data-i18n="group.zodiac_cn">按生肖</option>
                <option value="calendar_type" data-i18n="group.calendar">按历法</option>
                <option value="birth_month" data-i18n="group.birth_month">按生日月份</option>
              </select>
            </div>
            <button class="btn btn-ghost" id="fields-btn" data-i18n="toolbar.fields">显示字段</button>
          </div>
        </div>
        <div class="filter-panel hidden" id="contact-filter-panel">
          <div class="tool-group">
            <label for="f-gender" data-i18n="filter.gender">性别</label>
            <select id="f-gender"><option value="" data-i18n="filter.all">全部</option></select>
          </div>
          <div class="tool-group">
            <label for="f-zodiac" data-i18n="filter.zodiac">星座</label>
            <select id="f-zodiac"><option value="" data-i18n="filter.all">全部</option></select>
          </div>
          <div class="tool-group">
            <label for="f-zodiacCn" data-i18n="filter.zodiacCn">生肖</label>
            <select id="f-zodiacCn"><option value="" data-i18n="filter.all">全部</option></select>
          </div>
          <div class="tool-group">
            <label for="f-calendar" data-i18n="filter.calendar">历法</label>
            <select id="f-calendar"><option value="" data-i18n="filter.all">全部</option></select>
          </div>
          <div class="tool-group">
            <label for="f-enabled" data-i18n="filter.enabled">提醒状态</label>
            <select id="f-enabled"><option value="" data-i18n="filter.all">全部</option></select>
          </div>
          <button class="btn btn-ghost btn-sm" id="f-reset" data-i18n="filter.reset">重置</button>
        </div>
        <div id="contacts-list"></div>
        <div class="pagination" id="contacts-paging"></div>
      </section>

      <!-- 纪念日 -->
      <section id="view-anniversaries" class="view hidden">
        <div class="page-head" id="head-anniversaries"><div class="head-main"></div></div>
        <div class="toolbar">
          <div class="toolbar-left">
            <button class="btn btn-primary" id="add-anni-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-plus" /></svg> <span data-i18n="anni.addTitle">添加纪念日</span></button>
            <button class="btn btn-ghost" id="refresh-anni-btn" data-i18n="anni.refresh">刷新</button>
            <button class="btn btn-ghost" id="batch-test-anni-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-bell" /></svg> <span data-i18n="anni.batchTest">批量测试</span></button>
          </div>
          <div class="toolbar-right">
            <input id="anni-search" class="search-input" type="search" data-i18n-ph="search.placeholder" placeholder="搜索…" />
            <button class="btn btn-ghost" id="anni-filter-toggle"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-filter" /></svg> <span data-i18n="filter.title">筛选</span> <span id="anni-filter-count" class="badge"></span></button>
            <div class="seg" id="anni-view-mode" role="group">
              <button type="button" data-mode="card" class="on"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><use href="#ic-grid" /></svg> <span data-i18n="view.card">卡片</span></button>
              <button type="button" data-mode="list"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><use href="#ic-list" /></svg> <span data-i18n="view.table">表格</span></button>
            </div>
          </div>
        </div>
        <div class="filter-panel hidden" id="anni-filter-panel">
          <div class="tool-group">
            <label for="a-f-calendar" data-i18n="filter.calendar">历法</label>
            <select id="a-f-calendar"><option value="" data-i18n="filter.all">全部</option></select>
          </div>
          <div class="tool-group">
            <label for="a-f-enabled" data-i18n="filter.enabled">提醒状态</label>
            <select id="a-f-enabled"><option value="" data-i18n="filter.all">全部</option></select>
          </div>
          <button class="btn btn-ghost btn-sm" id="a-f-reset" data-i18n="filter.reset">重置</button>
        </div>
        <div id="anniversaries-list"></div>
      </section>

      <!-- 即将到来 -->
      <section id="view-upcoming" class="view hidden">
        <div class="page-head" id="head-upcoming"><div class="head-main"></div></div>
        <div class="toolbar" id="upcoming-toolbar">
          <div class="toolbar-left">
            <button class="btn btn-ghost" id="refresh-up-btn" data-i18n="btn.refresh">刷新</button>
          </div>
          <div class="toolbar-right">
            <input id="upcoming-search" class="search-input" type="search" data-i18n-ph="search.placeholder" placeholder="搜索…" />
            <button class="btn btn-ghost" id="upcoming-filter-toggle"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-filter" /></svg> <span data-i18n="filter.title">筛选</span> <span id="upcoming-filter-count" class="badge"></span></button>
            <div class="tool-group">
              <label for="up-view-mode" data-i18n="toolbar.view">视图</label>
              <select id="up-view-mode"><option value="list" data-i18n="view.table">表格</option><option value="card" data-i18n="view.card">卡片</option></select>
            </div>
          </div>
        </div>
        <div class="filter-panel hidden" id="upcoming-filter-panel">
          <div class="tool-group">
            <label for="u-f-category" data-i18n="filter.category">类别</label>
            <select id="u-f-category"><option value="" data-i18n="filter.all">全部</option></select>
          </div>
          <div class="tool-group">
            <label for="u-f-calendar" data-i18n="filter.calendar">历法</label>
            <select id="u-f-calendar"><option value="" data-i18n="filter.all">全部</option></select>
          </div>
          <button class="btn btn-ghost btn-sm" id="u-f-reset" data-i18n="filter.reset">重置</button>
        </div>
        <div id="upcoming-list"></div>
      </section>

      <!-- 家庭 -->
      <section id="view-family" class="view hidden">
        <div class="page-head" id="head-family"><div class="head-main"></div><div class="acts"><button class="btn btn-primary" id="create-family-btn"><span data-i18n="family.create">创建家庭</span></button></div></div>
        <div id="family-invites"></div>
        <div id="family-list"></div>
      </section>

      <!-- 个人资料及偏好 -->
      <section id="view-profile" class="view hidden">
        <div class="page-head" id="head-profile"><div class="head-main"></div></div>
        <div id="profile-content" style="display:flex;flex-direction:column;gap:16px"></div>
      </section>

      <!-- 设置 -->
      <section id="view-settings" class="view hidden">
        <div class="page-head" id="head-settings"><div class="head-main"></div></div>
        <div class="settings-layout">
          <nav class="settings-nav" id="settings-nav"></nav>
          <div class="settings-main">
            <div class="toolbar">
              <button class="btn btn-primary" id="save-settings-btn" data-i18n="settings.save">保存设置</button>
              <span class="muted" id="settings-hint" data-i18n="settings.hint">修改后立即生效，无需重启。</span>
            </div>
            <div id="settings-form"></div>
          </div>
        </div>
      </section>

      <!-- 用户管理 -->
      <section id="view-users" class="view hidden">
        <div class="page-head" id="head-users"><div class="head-main"></div><div class="acts"><button class="btn btn-primary" id="add-user-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-plus" /></svg> <span data-i18n="users.add">新增用户</span></button></div></div>
        <div id="users-list"></div>
      </section>

    </main>
  </div>
</div>

  <button class="tab on" data-view="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-cal" /></svg><span data-i18n="nav.dashboard">首页</span></button>

  <button class="tab" data-view="upcoming"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-clock" /></svg><span data-i18n="nav.upcoming">即将到来</span></button>
  <button class="tab" id="tab-more"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#ic-dot" /></svg><span data-i18n="nav.more">更多</span></button>
